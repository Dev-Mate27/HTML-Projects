<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A form which tests the functionalities of HTML, CSS, JavaScript.">
        <title>Provide Feedback</title>
        <link rel="icon" type="image/png" href="./Neutral-CountryBall.png">
    </head>

    <body>
        <header>
            <h1>Provide Feedback</h1>
            <img src="./Neutral-CountryBall.png" alt="A white country ball with happy eyes in a blue-grey background." width="100" height="100">
            <nav id="navigation">
                <a href="/index.html">Form</a>
                <a href="/results.html">Results</a>
            </nav>
        </header>
        <main>
            <form id="signupForm" name="signupForm" method="POST" action="#">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>
                    <br><br>
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required>
                    <br><br>
                    <label for="email">Email: </label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <br><br>
                    <label for="tel">Phone: </label>
                    <input type="tel" id="tel" name="tel" autocomplete="tel" required>
                    <br><br>
                    <label for="password">Set Password: </label>
                    <input type="password" id="password" name="password" minlength="12" maxlength="60" autocomplete="new-password" required>
                </fieldset>
                <fieldset>
                    <legend>Are you subscribed to our newsletter?</legend>
                    <input type="radio" id="yes-option" value="yes-option" name="newsletter" class="radio-btn" checked>
                    <label for="yes-option">Yes</label>
                    <br><br>
                    <input type="radio" id="no-option" value="no-option" name="newsletter" class="radio-btn">
                    <label for="no-option">No</label>
                </fieldset>
                <fieldset>
                    <legend>If subscribed, how do you find our service?</legend>
                    <select id="service-feedback" name="service-feedback">
                        <option selected value="excellent">Excellent</option>
                        <option value="good">Good</option>
                        <option value="average">Average</option>
                        <option value="bad">Bad</option>
                        <option value="horrible">Horrible</option>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>How did you find out about us?</legend>
                    <input type="checkbox" id="social-media" value="social-media" name="choice">
                    <label for="social-media">Social Media</label>
                    <br>
                    <input type="checkbox" id="personal-recommendation" value="personal-recommendation" name="choice">
                    <label for="personal-recommendation">Personal Recommendation</label>
                    <br>
                    <input type="checkbox" id="ads" value="ads" name="choice">
                    <label for="ads">Ads</label>
                    <br>
                    <input type="checkbox" id="search" value="search" name="choice">
                    <label for="search">Search</label>
                    <br>
                    <input type="checkbox" id="other" value="other" name="choice">
                    <label for="other">Other</label>
                </fieldset>
                <fieldset>
                    <legend>Any comments? (Optional)</legend>
                    <textarea id="comments" name="comments" rows="5" cols="50" minlength="10" placeholder="Enter your comment here..."></textarea>
                </fieldset>
                <button type="submit" id="submitSignup" name="submitSignup">Submit</button>
            </form>
        </main>
        <footer>
            <p class="cross">&copy; All rights reserved - 2026</p>
        </footer>
    </body>

</html>
